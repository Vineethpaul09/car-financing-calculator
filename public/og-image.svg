<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="150" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="100" r="200" fill="white" opacity="0.05"/>
  
  <!-- Main content -->
  <text x="600" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Car Financing</text>
  <text x="600" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Calculator</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white" opacity="0.9" text-anchor="middle">Compare Loans • Leases • Total Cost of Ownership</text>
  
  <!-- Location badge -->
  <rect x="450" y="450" width="300" height="50" rx="25" fill="white" opacity="0.2"/>
  <text x="600" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" text-anchor="middle">📍 Vancouver, BC</text>
  
  <!-- Free badge -->
  <rect x="50" y="50" width="120" height="40" rx="20" fill="#22c55e"/>
  <text x="110" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">FREE</text>
</svg>
