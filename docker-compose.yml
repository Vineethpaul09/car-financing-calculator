version: '3.8'

services:
  car-financing-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-financing-calculator
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
